name: 일일 스크리닝

permissions:
  contents: write   # 워크플로우가 결과 파일을 저장소에 다시 커밋할 수 있도록 쓰기 권한 부여

on:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 23:00, 전날) — 가격만 갱신, 재무는 캐시
    - cron: "0 23 * * *"
    # 분기 공시기한 다음날 한국시간 오전 6시 — 재무데이터 강제 재수집
    - cron: "0 21 15 5 *"   # 1분기보고서 마감(5/15) 다음날 06:00 KST
    - cron: "0 21 14 8 *"   # 반기보고서 마감(8/14) 다음날 06:00 KST
    - cron: "0 21 14 11 *"  # 3분기보고서 마감(11/14) 다음날 06:00 KST
    - cron: "0 21 31 3 *"   # 사업보고서 마감(3/31) 다음날 06:00 KST
  workflow_dispatch:
    inputs:
      force_finance:
        description: "재무데이터를 캐시 무시하고 강제로 새로 받기"
        type: boolean
        default: false
      ttm_quarter:
        description: "TTM 계산 기준 분기 (auto = 오늘 날짜로 자동 판단, 평소엔 이거 추천)"
        type: choice
        options: [auto, Q1, H1, Q3, FY]
        default: auto

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 패키지 설치
        run: pip install -r screening/requirements.txt

      - name: 주차(연도-주) 계산
        id: week
        run: echo "value=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: 재무데이터 캐시 복원 (주 단위 — 매일 새로 안 받음)
        uses: actions/cache@v4
        id: finance-cache
        with:
          path: screening/.cache
          key: finance-cache-v2-${{ steps.week.outputs.value }}
          restore-keys: |
            finance-cache-v2-

      - name: 재무데이터 없거나 강제갱신 요청/분기 공시일정 시 새로 받기
        if: >-
          steps.finance-cache.outputs.cache-hit != 'true' ||
          github.event.inputs.force_finance == 'true' ||
          contains(fromJSON('["0 21 15 5 *","0 21 14 8 *","0 21 14 11 *","0 21 31 3 *"]'), github.event.schedule)
        working-directory: screening
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          Q="${{ github.event.inputs.ttm_quarter || 'auto' }}"
          if [ "$Q" = "auto" ]; then
            python data_pipeline.py --build --auto --date $(date -d '1 day ago' +%Y%m%d) --force
          else
            python data_pipeline.py --build --year 2025 --ttm-quarter "$Q" --date $(date -d '1 day ago' +%Y%m%d) --force
          fi

      - name: 오늘자 가격 기준 스크리닝 실행 + JSON 저장
        working-directory: screening
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date -d '1 day ago' +%Y%m%d)
          YEAR=$(cat .cache/annual_year.txt 2>/dev/null || echo 2025)
          python ws_alpha.py --run --date $TODAY --year $YEAR --top 50 --export "" \
            --export-json "../web/data/results.json" \
            --filtered-json "../web/data/filtered_full.json"

      - name: 결과를 저장소에 커밋 (→ Vercel 자동 재배포 트리거)
        run: |
          git config user.name "screening-bot"
          git config user.email "screening-bot@users.noreply.github.com"
          git add web/data/results.json web/data/filtered_full.json
          git diff --cached --quiet || git commit -m "chore: 스크리닝 결과 자동 갱신 $(date +%Y-%m-%d)"
          git push

